<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baby shop till</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Till">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
  :root {
    --bg: #F2F4F1;
    --card: #FFFFFF;
    --ink: #16261F;
    --muted: #5A6A62;
    --line: #DDE3DE;
    --brand: #1F5C4A;
    --good: #2E7D63;
    --warn: #8A6100;
    --bad: #9B2C1F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "Helvetica Neue", sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    padding:
      calc(env(safe-area-inset-top) + 28px)
      calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 40px)
      calc(env(safe-area-inset-left) + 20px);
  }
  main { max-width: 32rem; margin: 0 auto; }

  .shopname { font-size: 15px; color: var(--brand); margin: 0 0 20px; }

  h1 {
    font-size: 30px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  h1[data-state="good"] { color: var(--good); }
  h1[data-state="bad"] { color: var(--bad); }

  .lede { margin: 0 0 26px; color: var(--muted); font-size: 16px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .panel h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin: 0;
    padding: 14px 18px 0;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 18px;
    border-top: 1px solid var(--line);
  }
  .panel h2 + .row { border-top: 0; }
  .row .n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .n[data-zero="yes"] { color: var(--muted); font-weight: 400; }

  .sale { padding: 4px 18px 18px; }
  .sale p { margin: 10px 0 0; }
  .sale .total { font-weight: 700; font-size: 21px; }
  .sale .fefo { color: var(--muted); font-size: 15px; }

  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--brand);
    border: 0;
    border-radius: 12px;
    padding: 15px 22px;
    min-height: 52px;
    width: 100%;
    margin-bottom: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #17473A; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.quiet {
    background: transparent;
    color: var(--bad);
    border: 1px solid var(--line);
  }
  button.quiet:active { background: #F6EAE8; }
  button[disabled] { opacity: 0.5; }

  footer {
    margin-top: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  footer b { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<main>
  <p class="shopname">Baby shop till</p>

  <h1 id="verdict">Checking…</h1>
  <p class="lede" id="lede">Reading what is saved on this iPad.</p>

  <section class="panel">
    <h2>Saved on this iPad</h2>
    <div class="row"><span>Products</span><span class="n" id="n-products">–</span></div>
    <div class="row"><span>Batches of stock</span><span class="n" id="n-batches">–</span></div>
    <div class="row"><span>Sales</span><span class="n" id="n-sales">–</span></div>
    <div class="row"><span>Items sold</span><span class="n" id="n-saleLines">–</span></div>
  </section>

  <section class="panel" id="last-panel" hidden>
    <h2>Most recent sale</h2>
    <div class="sale" id="last-sale"></div>
  </section>

  <button id="add">Save a test sale</button>
  <button id="clear" class="quiet">Delete all test data</button>

  <footer id="status">Checking the app…</footer>
</main>

<script src="./db.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };

  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function showStatus() {
    var home = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var offlineCopy = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

    $('status').innerHTML =
      'Internet <b>' + (navigator.onLine ? 'on' : 'off') + '</b> · ' +
      'Home Screen <b>' + (home ? 'yes' : 'no') + '</b> · ' +
      'Offline copy <b>' + (offlineCopy ? 'saved' : 'not yet') + '</b> · ' +
      'Foundation build 2';
  }

  function showLastSale(data) {
    if (!data) {
      $('last-panel').hidden = true;
      return;
    }
    $('last-panel').hidden = false;

    var sale = data.sale;
    var html = '';

    data.lines.forEach(function (line) {
      html += '<p>' + line.qty + ' \u00D7 ' + line.name +
        ' at ' + Till.formatKip(line.unitPriceKip) +
        ' = ' + Till.formatKip(line.lineTotalKip) + '</p>' +
        '<p class="fefo">from batch ' + line.batchCode +
        ', expires ' + (line.expiry || 'no expiry') + '</p>';
    });

    html += '<p class="total">Total ' + Till.formatKip(sale.totalKip) + '</p>';
    html += '<p class="fefo">Cash ' + Till.formatKip(sale.cashGivenKip) +
      ', change ' + Till.formatKip(sale.changeKip) + '</p>';

    $('last-sale').innerHTML = html;
  }

  function refresh() {
    return Till.counts().then(function (c) {
      ['products', 'batches', 'sales', 'saleLines'].forEach(function (key) {
        var el = $('n-' + key);
        el.textContent = c[key];
        el.setAttribute('data-zero', c[key] === 0 ? 'yes' : 'no');
      });

      if (c.sales > 0) {
        $('verdict').setAttribute('data-state', 'good');
        $('verdict').textContent = plural(c.sales, 'sale saved', 'sales saved');
        $('lede').textContent = 'Close the app completely and open it again. These numbers should not change.';
      } else {
        $('verdict').removeAttribute('data-state');
        $('verdict').textContent = 'Nothing saved yet';
        $('lede').textContent = 'Tap the button below to write one test sale into the till.';
      }

      return Till.lastSaleSummary();
    }).then(showLastSale)
      .catch(function (err) {
        $('verdict').setAttribute('data-state', 'bad');
        $('verdict').textContent = 'The till cannot save data';
        $('lede').textContent = String(err && err.message ? err.message : err);
      });
  }

  $('add').addEventListener('click', function () {
    $('add').disabled = true;
    Till.selfTest()
      .then(refresh)
      .catch(function (err) {
        $('verdict').setAttribute('data-state', 'bad');
        $('verdict').textContent = 'That sale did not save';
        $('lede').textContent = String(err && err.message ? err.message : err);
      })
      .then(function () { $('add').disabled = false; });
  });

  $('clear').addEventListener('click', function () {
    if (!window.confirm('Delete every product, batch and sale saved on this iPad?')) { return; }
    $('clear').disabled = true;
    Till.wipe()
      .then(refresh)
      .then(function () { $('clear').disabled = false; });
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }

  window.addEventListener('online', showStatus);
  window.addEventListener('offline', showStatus);

  showStatus();
  refresh();
</script>
</body>
</html>
